groups:
  - name: ledgerforge
    rules:
      - alert: ServiceDown
        expr: up{job="ledgerforge"} == 0
        for: 30s
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }} is not answering scrapes"

      - alert: High5xxRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }} is returning more than 2% 5xx"

      - alert: MessagesDeadLettered
        expr: sum by (queue) (increase(mq_messages_total{outcome=~"dead|poison"}[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Messages on {{ $labels.queue }} were dead-lettered. Money events may be stuck."

      - alert: MessagesRetrying
        expr: sum by (queue) (rate(mq_messages_total{outcome="retry"}[5m])) > 0.5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "{{ $labels.queue }} keeps retrying messages"

      - alert: MatchingSlow
        expr: |
          histogram_quantile(0.99, sum by (le, symbol) (rate(matching_match_duration_seconds_bucket[5m]))) > 0.005
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "p99 match time for {{ $labels.symbol }} is over 5ms"

      - alert: GatewayLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service="gateway"}[5m]))) > 0.5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Gateway p99 latency is over 500ms"
