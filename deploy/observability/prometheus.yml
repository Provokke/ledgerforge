global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ledgerforge
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:3000"]
        labels: { service: gateway }
      - targets: ["accounts:3001"]
        labels: { service: accounts }
      - targets: ["ledger:3002"]
        labels: { service: ledger }
      - targets: ["matching:3003"]
        labels: { service: matching }
