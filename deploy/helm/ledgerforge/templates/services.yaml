{{- $svcs := dict
  "gateway" (dict "port" 3000 "db" "")
  "accounts" (dict "port" 3001 "db" "accountsDatabaseUrl")
  "ledger" (dict "port" 3002 "db" "ledgerDatabaseUrl")
  "matching" (dict "port" 3003 "db" "matchingDatabaseUrl") -}}
{{- range $name, $s := $svcs }}
{{- $v := get $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "lf.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  {{- if eq $name "matching" }}
  # the book is in memory: never run two at once, even during a rollout
  strategy: { type: Recreate }
  {{- end }}
  template:
    metadata:
      labels: {{- include "lf.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
        prometheus.io/port: {{ $s.port | quote }}
        {{- if not $.Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ $s.port }} }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - { name: SERVICE, value: {{ $name | quote }} }
            - { name: PORT, value: {{ $s.port | quote }} }
            - { name: LOG_LEVEL, value: {{ $.Values.logLevel | quote }} }
            - { name: SYMBOLS, value: {{ $.Values.symbols | quote }} }
            {{- if $.Values.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.otlpEndpoint | quote }} }
            {{- end }}
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: {{ include "lf.secretName" $ }}, key: redisUrl } }
            - name: AMQP_URL
              valueFrom: { secretKeyRef: { name: {{ include "lf.secretName" $ }}, key: amqpUrl } }
            {{- if $s.db }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "lf.secretName" $ }}, key: {{ $s.db }} } }
            {{- end }}
            {{- if eq $name "gateway" }}
            - { name: RATE_LIMIT, value: {{ $v.rateLimit | quote }} }
            - { name: ACCOUNTS_URL, value: "http://{{ $.Release.Name }}-accounts:3001" }
            - { name: LEDGER_URL, value: "http://{{ $.Release.Name }}-ledger:3002" }
            - name: API_KEYS
              valueFrom: { secretKeyRef: { name: {{ include "lf.secretName" $ }}, key: apiKeys } }
            - name: ADMIN_KEY
              valueFrom: { secretKeyRef: { name: {{ include "lf.secretName" $ }}, key: adminKey } }
            {{- end }}
            {{- if eq $name "ledger" }}
            - { name: ACCOUNTS_URL, value: "http://{{ $.Release.Name }}-accounts:3001" }
            {{- end }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{- toYaml $v.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "lf.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports: [{ name: http, port: {{ $s.port }}, targetPort: http }]
{{- if and (ne $name "matching") (gt (int $v.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
