{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lf.secretName" . }}
  labels: {{- include "lf.labels" . | nindent 4 }}
type: Opaque
stringData:
  accountsDatabaseUrl: {{ .Values.secrets.accountsDatabaseUrl | quote }}
  ledgerDatabaseUrl: {{ .Values.secrets.ledgerDatabaseUrl | quote }}
  matchingDatabaseUrl: {{ .Values.secrets.matchingDatabaseUrl | quote }}
  redisUrl: {{ .Values.secrets.redisUrl | quote }}
  amqpUrl: {{ .Values.secrets.amqpUrl | quote }}
  apiKeys: {{ .Values.secrets.apiKeys | quote }}
  adminKey: {{ .Values.secrets.adminKey | quote }}
{{- end }}
