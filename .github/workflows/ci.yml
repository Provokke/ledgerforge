name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Docker is already on the runner; the integration test starts its own containers.
      - run: npm run test:integration

  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose up -d --build --wait
      - run: node scripts/e2e.ts
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint and render
        run: |
          docker run --rm -v "$PWD/deploy/helm:/c" -w /c alpine/helm:3.16.4 lint ledgerforge --set secrets.apiKeys=k:a,secrets.adminKey=x
          docker run --rm -v "$PWD/deploy/helm:/c" -w /c alpine/helm:3.16.4 template rel ledgerforge --set secrets.apiKeys=k:a,secrets.adminKey=x > /tmp/rendered.yaml
      - name: Validate manifests
        run: docker run --rm -v "$PWD/deploy/k8s:/k" -v /tmp:/t ghcr.io/yannh/kubeconform:latest -strict -summary /k/dev-infra.yaml /t/rendered.yaml
      - name: Terraform
        run: docker run --rm -v "$PWD/deploy:/d" -w /d/terraform --entrypoint sh hashicorp/terraform:1.10 -c 'terraform init -backend=false -input=false && terraform fmt -check && terraform validate'
